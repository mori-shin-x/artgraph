# lefthook は install 時に .git/hooks/ に stub を書き込むため、
# postinstall スクリプトの実行を許可する必要がある。
#
# esbuild は CI の vitest-compat ジョブ (spec 022 T024) が vitest@^3 を
# --no-lockfile で差し替え install する際にのみ依存ツリーへ入る (通常の
# lockfile install には現れない)。esbuild のプラットフォームバイナリは
# optional dependencies (@esbuild/linux-x64 等) で配布されるため postinstall
# の実行は不要 — 明示的に deny することで未承認ビルド扱いの
# [ERR_PNPM_IGNORED_BUILDS] (exit 1) を防ぐ。
allowBuilds:
  esbuild: false
  lefthook: true

# pnpm 10.16+ ではこのファイルが pnpm 設定の正規ファイル。
# 本リポジトリは単一パッケージなので `packages:` フィールドは持たず、
# pnpm 設定のみを記述する (workspace 宣言ではない)。

# サプライチェーン攻撃対策: npm に publish された直後の新バージョンは
# install 対象外にする (7 days = 10080 minutes)。pnpm 11 のデフォルトは
# 1440 (24h) だが、過去の典型的な攻撃 (eslint-config-prettier ~36h、
# nx 数日) の発覚タイミングをカバーするため 7 日まで広げる。
# 重大 CVE の即時対応が必要な場合は CLI flag で個別 override する。
minimumReleaseAge: 10080

# brace-expansion@5.0.8 は GHSA-mh99-v99m-4gvg (unbounded expansion DoS) の
# 公式修正版 (2026-07-23 publish) で、prod 依存 glob→minimatch 経由で必要。
# lockfile が exact version + integrity で固定するため名前単位の除外でも
# 実質リスクはない。5.0.8 が 7 日を超える 2026-07-30 以降に削除可。
minimumReleaseAgeExclude:
  - brace-expansion

# 旧 G1 対応の overrides (plist / node-fetch / cross-spawn / trim-newlines /
# uuid / nth-check) は、対象だった devDependency `svg-term-cli` を依存ツリー
# から外した (demo:svg は `pnpm dlx svg-term-cli` でオンデマンド実行、#400)
# ことで全て不要になり削除した。dlx 実行は overrides の適用外だが、demo は
# メンテナが手元の信頼済み .cast ファイルに対して実行するもので、脆弱性の
# 対象経路 (リモート scheme の fetch / iTerm profile の XML parse) は
# 使用しない。
